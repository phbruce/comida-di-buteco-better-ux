<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Coxinha em paper-cut sharp.
    Forma de gota invertida (largura embaixo, ponta no topo), dourada
    com pequenos cortes diagonais sugerindo a massa rugosa.
  -->
  <g>
    <!-- Corpo em forma de gota — dendê -->
    <polygon
      points="32,8 35,11 39,17 43,24 46,32 47,40 45,47 41,53 35,56 28,56 22,53 19,47 17,40 18,32 21,24 25,17 29,11"
      fill="#f4b400"
    />

    <!-- Sombra à direita — dendê escuro -->
    <polygon
      points="32,8 35,11 39,17 43,24 46,32 47,40 45,47 41,53 35,56 36,49 39,40 40,32 39,23 36,15"
      fill="#a8770b"
    />

    <!-- Highlight no canto esquerdo — dourado claro -->
    <polygon
      points="22,28 26,26 27,32 24,38 21,36"
      fill="#ffe9a3"
    />

    <!-- Cortes/sulcos diagonais (textura da massa) — dendê escuro -->
    <polygon points="24,20 38,28 38,29 24,21" fill="#a8770b" />
    <polygon points="22,30 41,40 41,41 22,31" fill="#a8770b" />
    <polygon points="20,40 42,48 42,49 20,41" fill="#a8770b" />

    <!-- Pontinha do topo — destaque dourado escuro -->
    <polygon
      points="30,8 34,8 33,13 31,13"
      fill="#a8770b"
    />
  </g>
</svg>
