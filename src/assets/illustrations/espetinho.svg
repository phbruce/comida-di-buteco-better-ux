<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Espetinho em paper-cut sharp.
    Espeto de bambu na diagonal, com 4 cubos alternando carne (urucum),
    cebola (cream), pimentão (lima), carne. Cada cubo com sombra própria.
  -->
  <g>
    <!-- Espeto (bambu) na diagonal -->
    <polygon
      points="8,52 12,56 56,12 52,8"
      fill="#a89977"
    />
    <!-- Sombra do espeto -->
    <polygon
      points="12,56 56,12 54,10 10,54"
      fill="#5a3a1f"
    />
    <!-- Ponta afiada do espeto -->
    <polygon
      points="52,8 56,12 58,9 55,6"
      fill="#5a3a1f"
    />

    <!-- Cubo 1 (carne urucum) — superior direito -->
    <polygon
      points="44,12 52,12 56,16 56,24 52,24 44,16"
      fill="#9c2a1b"
    />
    <polygon
      points="52,12 56,16 56,24 52,24 50,18 50,14"
      fill="#5a160e"
    />
    <polygon
      points="44,12 52,12 50,15 46,15"
      fill="#c4392d"
    />

    <!-- Cubo 2 (cebola cream) -->
    <polygon
      points="34,22 42,22 46,26 46,34 42,34 34,26"
      fill="#fbf7f0"
    />
    <polygon
      points="42,22 46,26 46,34 42,34 40,28 40,24"
      fill="#d4c8b0"
    />
    <polygon
      points="34,22 42,22 40,25 36,25"
      fill="#ffffff"
    />

    <!-- Cubo 3 (pimentão lima) -->
    <polygon
      points="24,32 32,32 36,36 36,44 32,44 24,36"
      fill="#1f6f4a"
    />
    <polygon
      points="32,32 36,36 36,44 32,44 30,38 30,34"
      fill="#0e3a26"
    />
    <polygon
      points="24,32 32,32 30,35 26,35"
      fill="#3a9667"
    />

    <!-- Cubo 4 (carne urucum) — inferior esquerdo -->
    <polygon
      points="14,42 22,42 26,46 26,54 22,54 14,46"
      fill="#9c2a1b"
    />
    <polygon
      points="22,42 26,46 26,54 22,54 20,48 20,44"
      fill="#5a160e"
    />
    <polygon
      points="14,42 22,42 20,45 16,45"
      fill="#c4392d"
    />
  </g>
</svg>
