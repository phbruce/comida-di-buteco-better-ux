<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Limão tahiti em paper-cut sharp.
    Bulbo redondo verde, com pequena protuberância no topo (ponta) e
    pequenas folhas. Variação tonal lima clara/escura.
  -->
  <g>
    <!-- Bulbo principal — lima -->
    <polygon
      points="32,15 39,16 45,19 50,24 53,30 53,37 51,43 47,49 41,53 32,55 23,53 17,49 13,43 11,37 11,30 14,24 19,19 25,16"
      fill="#1f6f4a"
    />

    <!-- Sombra direita — lima escuro -->
    <polygon
      points="39,16 45,19 50,24 53,30 53,37 51,43 47,49 41,53 32,55 36,49 41,42 43,35 41,28 38,22 35,17"
      fill="#0e3a26"
    />

    <!-- Highlight no canto superior-esquerdo -->
    <polygon
      points="20,22 26,20 27,26 24,30 19,29"
      fill="#3a9667"
    />

    <!-- Pontinha do limão (cabo) no topo -->
    <polygon
      points="29,15 35,15 34,11 32,9 30,11"
      fill="#0e3a26"
    />

    <!-- Folha pequena -->
    <polygon
      points="34,12 40,8 43,12 40,15"
      fill="#155234"
    />
  </g>
</svg>
