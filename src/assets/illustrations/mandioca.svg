<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Mandioca em paper-cut sharp.
    Tubérculo alongado curvado, casca marrom-escura com listras horizontais
    sugerindo textura. Pequena folha lima na base superior.
  -->
  <g>
    <!-- Casca exterior — marrom (sépia escuro) -->
    <polygon
      points="22,12 28,12 33,14 37,18 41,24 44,32 45,40 44,47 41,53 36,57 30,58 25,55 22,49 22,42 21,35 21,27 20,20"
      fill="#5a3a1f"
    />

    <!-- Sombra à direita — marrom mais escuro -->
    <polygon
      points="33,14 37,18 41,24 44,32 45,40 44,47 41,53 36,57 36,52 38,45 39,37 38,28 35,20"
      fill="#2e1d0e"
    />

    <!-- Polpa visível (cortada na ponta de cima) — branco/cream -->
    <polygon
      points="22,12 28,12 27,16 23,16"
      fill="#fbf7f0"
    />

    <!-- Listras horizontais sugerindo casca rugosa -->
    <polygon points="22,22 42,24 42,25 22,23" fill="#2e1d0e" />
    <polygon points="22,30 44,32 44,33 22,31" fill="#2e1d0e" />
    <polygon points="22,38 45,40 45,41 22,39" fill="#2e1d0e" />
    <polygon points="22,46 44,48 44,49 23,47" fill="#2e1d0e" />

    <!-- Highlight no topo-esquerdo — marrom claro -->
    <polygon
      points="23,18 27,18 27,22 24,24"
      fill="#8b5e36"
    />

    <!-- Folhinha lima saindo do topo -->
    <polygon
      points="26,12 30,6 34,8 32,12"
      fill="#1f6f4a"
    />
  </g>
</svg>
