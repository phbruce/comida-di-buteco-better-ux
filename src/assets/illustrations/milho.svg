<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Espiga de milho em paper-cut sharp.
    Camadas: silhueta dendê (corpo cilíndrico), grãos sugeridos por
    faixas dendê escuro, palhas (husks) lima saindo dos lados, sombra
    sutil à direita.
  -->
  <g>
    <!-- Silhueta amarela — corpo da espiga, aproximadamente cilíndrico -->
    <polygon
      points="26,12 32,11 38,12 41,16 42,22 42,30 42,38 41,45 39,51 35,55 31,56 27,55 24,51 23,45 22,38 22,30 22,22 23,16"
      fill="#f4b400"
    />

    <!-- Sombra direita — dendê mais escuro -->
    <polygon
      points="38,12 41,16 42,22 42,30 42,38 41,45 39,51 35,55 31,56 33,52 35,46 36,38 36,30 36,22 35,17"
      fill="#a8770b"
    />

    <!-- Faixas de grãos — dendê escuro, sugerem fileiras -->
    <polygon points="24,17 41,17 41,19 24,19" fill="#a8770b" />
    <polygon points="23,24 42,24 42,26 23,26" fill="#a8770b" />
    <polygon points="23,31 42,31 42,33 23,33" fill="#a8770b" />
    <polygon points="23,38 42,38 42,40 23,40" fill="#a8770b" />
    <polygon points="24,45 41,45 41,47 24,47" fill="#a8770b" />

    <!-- Pequenos cortes verticais sugerindo grãos individuais -->
    <polygon points="29,15 30,15 30,52 29,52" fill="#a8770b" />
    <polygon points="34,15 35,15 35,52 34,52" fill="#a8770b" />

    <!-- Palha esquerda — verde lima -->
    <polygon
      points="22,28 14,24 12,32 14,42 18,48 22,46 23,40 22,34"
      fill="#1f6f4a"
    />
    <!-- Sombra da palha esquerda -->
    <polygon
      points="14,24 17,28 18,38 19,46 18,48 14,42 12,32"
      fill="#0e3a26"
    />

    <!-- Palha direita — verde lima -->
    <polygon
      points="42,30 50,26 53,34 51,44 47,50 43,46 42,40 42,34"
      fill="#1f6f4a"
    />
    <!-- Sombra da palha direita -->
    <polygon
      points="50,26 53,34 51,44 47,50 47,44 49,36"
      fill="#0e3a26"
    />

    <!-- Topo (cabelo do milho) — dendê escuro -->
    <polygon
      points="28,11 30,7 32,5 34,7 36,11 33,9 30,9"
      fill="#a8770b"
    />
  </g>
</svg>
