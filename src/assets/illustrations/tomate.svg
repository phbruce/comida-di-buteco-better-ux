<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Tomate em paper-cut sharp.
    Camadas: bulbo urucum redondo, sombra urucum-escuro à direita,
    cabo lima com folhinhas em estrela.
  -->
  <g>
    <!-- Bulbo redondo — urucum -->
    <polygon
      points="32,17 39,18 45,21 50,26 53,32 53,39 51,45 47,51 41,55 32,57 23,55 17,51 13,45 11,39 11,32 14,26 19,21 25,18"
      fill="#b3261e"
    />

    <!-- Sombra direita — urucum mais escuro -->
    <polygon
      points="32,17 39,18 45,21 50,26 53,32 53,39 51,45 47,51 41,55 32,57 36,50 41,43 43,36 41,28 38,22 35,18"
      fill="#7a1a13"
    />

    <!-- Highlight no canto superior-esquerdo — vermelho claro -->
    <polygon
      points="20,25 26,22 27,28 24,33 19,32"
      fill="#d94c3f"
    />

    <!-- Cabo (verde) — pequeno cilindro central no topo -->
    <polygon
      points="30,15 34,15 33,11 31,11"
      fill="#1f6f4a"
    />

    <!-- Estrela de folhas no topo — lima escuro -->
    <polygon
      points="32,8 26,12 22,16 28,17 32,15 36,17 42,16 38,12"
      fill="#1f6f4a"
    />
    <polygon
      points="32,8 30,14 32,18 34,14"
      fill="#155234"
    />
    <polygon
      points="22,16 27,18 30,17 26,15"
      fill="#155234"
    />
    <polygon
      points="42,16 37,18 34,17 38,15"
      fill="#155234"
    />
  </g>
</svg>
