<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Folha de couve em paper-cut sharp.
    Camadas: silhueta lima, sombra lima escura à direita, nervura central
    em verde escuro, highlight lima clara no canto superior-esquerdo.
  -->
  <g>
    <!-- Silhueta verde — folha oval pontuda -->
    <polygon
      points="32,7 38,9 44,13 49,19 52,26 53,33 52,40 49,47 44,53 38,57 32,58 26,57 20,53 15,47 12,40 11,33 12,26 15,19 20,13 26,9"
      fill="#1f6f4a"
    />

    <!-- Sombra direita — verde mais escuro -->
    <polygon
      points="32,7 38,9 44,13 49,19 52,26 53,33 52,40 49,47 44,53 38,57 32,58 35,52 39,45 42,38 44,30 43,22 40,15 36,10"
      fill="#0e3a26"
    />

    <!-- Nervura central — verde escuro fino -->
    <polygon
      points="31,9 33,9 34,32 33,55 31,55 30,32"
      fill="#0e3a26"
    />

    <!-- Highlight no canto superior-esquerdo — verde claro chapado -->
    <polygon
      points="22,18 27,16 28,22 25,27 21,28 19,24"
      fill="#3a9667"
    />

    <!-- Pequeno talo em baixo — verde escuro -->
    <polygon
      points="30,57 34,57 33,62 31,62"
      fill="#0e3a26"
    />
  </g>
</svg>
