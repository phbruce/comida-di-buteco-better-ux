<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="presentation" aria-hidden="true">
  <!--
    Caipirinha em paper-cut sharp.
    Copo curto (tumbler) de retas, líquido âmbar claro, fatias de limão
    flutuando, canudo verde no topo. Highlight de vidro à esquerda.
  -->
  <g>
    <!-- Copo (vidro) — cinza claro pra dar transparência -->
    <polygon
      points="20,16 44,16 43,52 39,57 25,57 21,52"
      fill="#e6dfd0"
    />

    <!-- Líquido âmbar claro — caipirinha (cachaça + açucar) -->
    <polygon
      points="22,22 42,22 41,52 38,55 26,55 23,52"
      fill="#ffe9a3"
    />

    <!-- Sombra do líquido à direita -->
    <polygon
      points="42,22 41,52 38,55 36,52 37,40 38,28"
      fill="#f4b400"
    />

    <!-- Fatia de limão 1 (alta) — lima clara com casca lima escura -->
    <polygon points="26,28 32,26 36,30 33,34 27,33" fill="#3a9667" />
    <polygon points="28,29 31,28 33,30 31,33 29,32" fill="#1f6f4a" />

    <!-- Fatia de limão 2 (média) -->
    <polygon points="29,38 36,36 38,40 35,43 30,42" fill="#3a9667" />
    <polygon points="31,39 34,38 36,40 34,42 31,41" fill="#1f6f4a" />

    <!-- Cubo de gelo (branco translúcido) -->
    <polygon points="24,40 27,38 30,40 28,44 25,44" fill="#fbf7f0" />

    <!-- Highlight do vidro à esquerda — branco -->
    <polygon
      points="22,22 23,22 23,52 22,52"
      fill="#fbf7f0"
    />

    <!-- Canudo verde subindo do copo -->
    <polygon
      points="36,8 38,8 36,22 34,22"
      fill="#1f6f4a"
    />

    <!-- Borda superior do copo (lábio) — sutil -->
    <polygon
      points="20,16 44,16 44,18 20,18"
      fill="#a89977"
    />
  </g>
</svg>
