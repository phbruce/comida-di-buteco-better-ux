name: Acessibilidade (Pa11y)

# Roda Pa11y (axe-core embutido) contra a versão deployada no GitHub Pages
# pra capturar erros de acessibilidade WCAG 2.2 AA. Não bloqueia merges
# por padrão — é sinal pra triagem, não gate. RNF-0001 + Fase 5 do ROADMAP.
#
# Pra promover pra gate (failOnError), trocar `continue-on-error: true`
# pra `false` no step principal e rodar apenas em pushes pra main.

on:
  workflow_dispatch:
  schedule:
    # Semanal segunda 9 UTC (~6h BRT) — uma sweep por semana é suficiente
    # pra capturar regressões sem inflar uso do Actions.
    - cron: "0 9 * * 1"
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  pa11y:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pa11y
        run: npm install --no-save pa11y@8

      - name: Run pa11y nas URLs deployadas
        id: pa11y
        continue-on-error: true
        run: |
          set +e  # capturar saída de cada URL sem matar o job
          mkdir -p reports
          urls=(
            "https://phbruce.github.io/comida-di-buteco-better-ux/"
            "https://phbruce.github.io/comida-di-buteco-better-ux/concurso/"
            "https://phbruce.github.io/comida-di-buteco-better-ux/sobre/"
            "https://phbruce.github.io/comida-di-buteco-better-ux/butecos/belo-horizonte/"
          )
          fail=0
          for url in "${urls[@]}"; do
            slug=$(echo "$url" | sed 's|https://phbruce.github.io/comida-di-buteco-better-ux||' | sed 's|/|_|g')
            [ -z "$slug" ] && slug="_root"
            out="reports/pa11y${slug}.json"
            echo "▶ $url"
            npx pa11y --standard WCAG2AA --reporter json "$url" > "$out" 2>/dev/null || fail=$((fail+1))
            count=$(jq 'length' "$out" 2>/dev/null || echo "?")
            echo "  → $count issues  (saved to $out)"
          done
          echo "fail_count=$fail" >> "$GITHUB_OUTPUT"
          echo ""
          echo "URLs com >0 issues: $fail / ${#urls[@]}"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-results
          path: reports/
          retention-days: 30

      - name: Resumo
        run: |
          echo "Relatório completo no artifact 'pa11y-results' (JSON por URL)."
          echo "Pra abrir: download → cada arquivo é um array JSON de issues."
          echo "Filtre por severity ('error') no jq, ex.:"
          echo "  jq '[.[] | select(.type==\"error\")] | length' reports/pa11y_.json"
