name: Deploy to GitHub Pages

on:
  push:
    # `main` é o destino canônico; a branch claude/* é temporária enquanto não
    # mergeamos para main (Fase 0). Remover quando main passar a existir.
    branches:
      - main
      - claude/design-system-setup-6xB7T
  workflow_dispatch:

# Permissões necessárias para o deploy via actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite uma única execução em curso por commit; pull-requests cancelam o anterior
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build (BASE_PATH para GitHub Pages)
        env:
          # ATENÇÃO: GitHub Pages é case-sensitive no path do repo.
          # O repositório está como "Comida-di-Buteco-Better-UX" (PascalCase),
          # então o BASE precisa bater EXATAMENTE com isso.
          # Para padronizar em lowercase, renomear o repo no GitHub e trocar aqui.
          BASE_PATH: /Comida-di-Buteco-Better-UX
          SITE_URL: https://phbruce.github.io
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
