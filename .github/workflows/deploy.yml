name: Deploy to GitHub Pages

on:
  push:
    # `main` é o destino canônico; a branch claude/* é temporária enquanto não
    # mergeamos para main (Fase 0). Remover quando main passar a existir.
    branches:
      - main
      - claude/design-system-setup-6xB7T
  workflow_dispatch:

# Permissões necessárias para o deploy via actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite uma única execução em curso por commit; pull-requests cancelam o anterior
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build (BASE_PATH para GitHub Pages)
        env:
          # Repo está em lowercase no GitHub (renomeado em 2026-05-09).
          # Para builds com custom domain, exporte BASE_PATH="" antes do build.
          BASE_PATH: /comida-di-buteco-better-ux
          SITE_URL: https://phbruce.github.io
          # Chave do Google Maps Embed API (ADR-0010). Vem de Repo Secrets
          # (Settings → Secrets and variables → Actions → New repository secret
          # com nome GOOGLE_MAPS_KEY). Se não estiver definida, o build segue
          # com fallback ?output=embed (não interativo no mobile).
          PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
