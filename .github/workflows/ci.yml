name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/**

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Astro check (typecheck)
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Bate com o case do repo no GitHub (Pages é case-sensitive).
          BASE_PATH: /Comida-di-Buteco-Better-UX
          SITE_URL: https://phbruce.github.io
